<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NRL Career Simulator</title>
<style>
  :root{
    --ground:#070b10; --bezel:#0d141c; --text:#c8d2dc;
    --title:#5fd7d7; --good:#4ec96a; --bad:#ff5f5f; --warn:#e0a83c;
    --accent:#d98fe8; --dim:#5d6a78;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--ground);display:flex;align-items:center;justify-content:center;
       font-family:ui-monospace,"Cascadia Mono","JetBrains Mono",Menlo,Consolas,monospace;}
  .crt{position:relative;background:var(--bezel);border-radius:14px;padding:16px 20px;
       box-shadow:0 0 70px rgba(95,215,215,.08), inset 0 0 46px rgba(0,0,0,.65);}
  .crt::after{content:"";position:absolute;inset:0;border-radius:14px;pointer-events:none;
       background:repeating-linear-gradient(0deg,rgba(0,0,0,.15) 0 1px,transparent 1px 3px);}
  pre#screen{margin:0;font-family:inherit;font-size:clamp(6px,1.02vw,15px);line-height:1.18;
       color:var(--text);text-shadow:0 0 6px rgba(200,210,220,.14);}
  canvas#game{display:none;width:min(90vw,960px);aspect-ratio:960/600;border-radius:6px;
       image-rendering:pixelated;}
  .title{color:var(--title)} .good{color:var(--good)} .bad{color:var(--bad)}
  .warn{color:var(--warn)} .accent{color:var(--accent)} .dim{color:var(--dim)}
  .bold{font-weight:700}
  .rev{background:var(--text);color:var(--ground);text-shadow:none}
  .rev.good{background:var(--good)} .rev.bad{background:var(--bad)}
  .rev.warn{background:var(--warn)} .rev.accent{background:var(--accent)}
  .rev.title{background:var(--title)}
  .blink{animation:blink .7s steps(2) infinite}
  @keyframes blink{50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){.blink{animation:none}}
</style>
</head>
<body>
<div class="crt"><pre id="screen"></pre><canvas id="game" width="960" height="600"></canvas></div>
<script>
"use strict";
/* ================= character-grid screen (menus, ticker) ================= */
const W=100,H=34;
const el=document.getElementById("screen");
let buf;
function esc(c){return c==="&"?"&amp;":c==="<"?"&lt;":c===">"?"&gt;":c;}
function clear(){buf=Array.from({length:H},()=>Array.from({length:W},()=>({ch:" ",cls:""})));}
function put(y,x,text,cls=""){
  y=Math.round(y);x=Math.round(x);
  if(y<0||y>=H)return;
  for(let i=0;i<text.length;i++){const xx=x+i;if(xx<0||xx>=W)continue;buf[y][xx]={ch:text[i],cls};}
}
function center(y,text,cls=""){put(y,Math.max(0,Math.floor((W-text.length)/2)),text,cls);}
function box(y,x,h,w,title=""){
  put(y,x,"┌"+"─".repeat(w-2)+"┐","dim");
  for(let r=y+1;r<y+h-1;r++){put(r,x,"│","dim");put(r,x+w-1,"│","dim");}
  put(y+h-1,x,"└"+"─".repeat(w-2)+"┘","dim");
  if(title)put(y,x+2," "+title+" ","title bold");
}
function statColor(v){return v>=70?"good":v>=40?"warn":"bad";}
function meter(y,x,width,value,label=""){
  if(label){put(y,x,label.padEnd(10));x+=10;}
  const filled=Math.round(width*value/100);
  put(y,x,"[");
  put(y,x+1,"█".repeat(filled),statColor(value));
  put(y,x+1+filled,"░".repeat(width-filled),"dim");
  put(y,x+1+width,"] "+String(Math.round(value)).padStart(3));
}
function wrapSpan(t,cls){return cls?'<span class="'+cls+'">'+t+"</span>":t;}
function render(){
  textMode();
  let html="";
  for(const row of buf){
    let cur=null,run="";
    for(const c of row){
      if(c.cls!==cur){if(run)html+=wrapSpan(run,cur);cur=c.cls;run="";}
      run+=esc(c.ch);
    }
    html+=wrapSpan(run,cur)+"\n";
  }
  el.innerHTML=html;
}
/* ================= arcade canvas layer (mini-games) ================= */
const cv=document.getElementById("game");
const ctx=cv.getContext("2d");
const CW=960,CH=600;
const DPR=Math.min(2,window.devicePixelRatio||1);
cv.width=CW*DPR;cv.height=CH*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
function canvasMode(){cv.style.display="block";el.style.display="none";}
function textMode(){el.style.display="block";cv.style.display="none";}
const NIGHT="#0a1018",FIELD_A="#2e7d32",FIELD_B="#28702c",LINE="rgba(255,255,255,.78)";
const MY_KIT={jersey:"#37b6be",hoops:"#0c3550",shorts:"#eef2f4",skin:"#e2b184",hair:"#2b2118"};
const OPP_KIT={jersey:"#d84f4f",hoops:"#5c1717",shorts:"#1c1c1c",skin:"#caa27c",hair:"#151210"};
const CROWD=[];
{
  const cols=["#c9563f","#3f7fc9","#c9b53f","#7fc93f","#b04fd0","#e8e8e8","#3fc9b5"];
  for(let i=0;i<900;i++)CROWD.push({x:Math.random()*CW,y:8+Math.random()*68,c:cols[i%cols.length],tw:Math.random()*6.28});
}
function drawCrowd(t){
  ctx.fillStyle="#101720";ctx.fillRect(0,0,CW,86);
  for(const s of CROWD){
    ctx.globalAlpha=.45+.4*Math.abs(Math.sin(t*2+s.tw));
    ctx.fillStyle=s.c;ctx.fillRect(s.x,s.y,3,3);
  }
  ctx.globalAlpha=1;
  ctx.fillStyle="#0d141c";ctx.fillRect(0,86,CW,8);
}
function drawPlayerSprite(cx,footY,u,kit,frame=0,facing=1,pose="run"){
  ctx.save();ctx.translate(cx,footY);if(facing<0)ctx.scale(-1,1);
  const R=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(x*u,y*u,w*u,h*u);};
  const skin=kit.skin;
  if(pose==="kick"){
    R(-2.2,-4,1.8,4,skin);R(-2.4,-.9,2.2,.9,"#111");
    R(.4,-5.4,3.2,1.6,skin);R(3.4,-5.8,1.5,1.5,"#111");
  }else{
    const a=frame?1:-1;
    R(-2.4+a*.8,-4,1.8,2.4,skin);R(.6-a*.8,-4,1.8,2.4,skin);
    R(-2.4+a*.8,-1.7,1.8,1.1,kit.hoops);R(.6-a*.8,-1.7,1.8,1.1,kit.hoops);
    R(-2.4+a*.8,-.7,1.9,.7,"#111");R(.6-a*.8,-.7,1.9,.7,"#111");
  }
  R(-2.6,-6.1,5.2,2.3,kit.shorts);
  R(-2.8,-11,5.6,5,kit.jersey);
  R(-2.8,-9.5,5.6,1.4,kit.hoops);
  const sw=frame?1:-1;
  R(-4.2,-10.8+sw*.5,1.4,3.4,kit.jersey);R(2.8,-10.8-sw*.5,1.4,3.4,kit.jersey);
  R(-4.2,-7.4+sw*.5,1.4,1.2,skin);R(2.8,-7.4-sw*.5,1.4,1.2,skin);
  R(-1.5,-14.4,3,3.5,skin);
  R(-1.7,-14.9,3.4,1.3,kit.hair);
  ctx.restore();
}
function drawBall(x,y,s=1,rot=-.5){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(s,s);
  ctx.fillStyle="#8a5a2b";
  ctx.beginPath();ctx.ellipse(0,0,11,7,0,0,6.3);ctx.fill();
  ctx.strokeStyle="#e8e0d0";ctx.lineWidth=1.6;
  ctx.beginPath();ctx.moveTo(-7,0);ctx.lineTo(7,0);ctx.stroke();
  ctx.restore();
}
function drawPosts(cx,groundY){
  ctx.fillStyle="#e8ecef";
  ctx.fillRect(cx-64,groundY-190,8,190);
  ctx.fillRect(cx+56,groundY-190,8,190);
  ctx.fillRect(cx-64,groundY-104,128,8);
  ctx.fillStyle="#d04040";
  ctx.fillRect(cx-67,groundY-36,14,36);
  ctx.fillRect(cx+53,groundY-36,14,36);
}
function atext(text,x,y,size,color,align="center"){
  ctx.font="700 "+size+"px ui-monospace,Menlo,Consolas,monospace";
  ctx.textAlign=align;ctx.textBaseline="middle";
  ctx.lineWidth=Math.max(3,size/8);ctx.strokeStyle="#06090d";ctx.strokeText(text,x,y);
  ctx.fillStyle=color;ctx.fillText(text,x,y);
}
async function canvasBanner(text,color,ms=1300){
  ctx.fillStyle="rgba(4,7,10,.6)";ctx.fillRect(0,CH/2-58,CW,116);
  atext(text,CW/2,CH/2,40,color);
  await sleep(ms);
}
/* ================= input & timing ================= */
let keyBuf=[],waiters=[];
document.addEventListener("keydown",e=>{
  const k=e.key;
  if([" ","ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Enter"].includes(k))e.preventDefault();
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(waiters.length)waiters.shift()(k);
  else if(keyBuf.length<32)keyBuf.push(k);
});
function waitKey(){keyBuf.length=0;return new Promise(res=>waiters.push(res));}
function sleep(ms){return new Promise(res=>setTimeout(res,ms));}
function frameLoop(step){
  keyBuf.length=0;
  return new Promise(res=>{
    let last=performance.now();
    function f(now){
      const dt=Math.min(.1,(now-last)/1000);last=now;
      const keys=keyBuf.splice(0);
      if(step(dt,keys)){res();return;}
      requestAnimationFrame(f);
    }
    requestAnimationFrame(f);
  });
}
async function flash(text,cls="",ms=1200){center(H>>1,"  "+text+"  ",cls+" rev");render();await sleep(ms);}
/* ================= rng ================= */
const rand=Math.random;
function randint(a,b){return a+Math.floor(rand()*(b-a+1));}
function gauss(mu,sigma){const u=1-rand(),v=rand();return mu+sigma*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
function choice(arr){return arr[Math.floor(rand()*arr.length)];}
function weighted(items,weights){
  let t=weights.reduce((a,b)=>a+b,0),r=rand()*t;
  for(let i=0;i<items.length;i++){r-=weights[i];if(r<0)return items[i];}
  return items[items.length-1];
}
function sampleMinutes(lo,hi,n){const s=new Set();while(s.size<n)s.add(randint(lo,hi));return[...s].sort((a,b)=>a-b);}
class Osc{
  constructor(lo,hi,speed,start=null){this.lo=lo;this.hi=hi;this.speed=speed;this.value=start===null?lo:start;this.dir=1;}
  adv(dt){
    this.value+=this.dir*this.speed*dt;
    while(this.value>this.hi||this.value<this.lo){
      if(this.value>this.hi){this.value=2*this.hi-this.value;this.dir=-1;}
      else{this.value=2*this.lo-this.value;this.dir=1;}
    }
    return this.value;
  }
}
/* ================= game data ================= */
const TEAMS=[["Brisbane Broncos","BRI"],["Canberra Raiders","CBR"],["Canterbury Bulldogs","CBY"],
["Cronulla Sharks","CRO"],["Dolphins","DOL"],["Gold Coast Titans","GLD"],["Manly Sea Eagles","MAN"],
["Melbourne Storm","MEL"],["Newcastle Knights","NEW"],["New Zealand Warriors","NZW"],
["North Queensland Cowboys","NQL"],["Parramatta Eels","PAR"],["Penrith Panthers","PEN"],
["South Sydney Rabbitohs","SOU"],["St George Illawarra Dragons","SGI"],["Sydney Roosters","SYD"],
["Wests Tigers","WST"]];
const ROUNDS=27,BYE=-1;
const SURNAMES=["Cleary","Tedesco","Munster","Ponga","Hughes","Grant","Cobbo","Walsh","Mitchell",
"Crichton","Yeo","Fifita","Tuilagi","Katoa","Brimson","Haas","Carrigan","Moses","Luai","Hammer"];
const FLAVOUR=[
"{p} kicks deep into the corner...",
"{p} breaks the line down the short side!",
"Big hit from {p} in midfield!",
"{p} takes the high ball under pressure.",
"Scrum feed to {t}, {p} at first receiver...",
"{p} chances an offload... it sticks!",
"Error! {t} cough it up in good field position.",
"{p} makes 40 metres on the kick return!",
"Penalty against {t} for holding down.",
"{p} grubbers in behind... just too heavy."];
const SHOP=[["Energy Drink",50,"Restore 25% energy","energy",25],
["Sports Massage",120,"Restore 60% energy","energy",60],
["Speed Boots",400,"+3 Speed","speed",3],
["Gym Membership",400,"+3 Strength","strength",3],
["Kicking Tee",350,"+3 Kicking","kicking",3],
["Grip Gloves",350,"+3 Passing","passing",3],
["Tackle Pads",350,"+3 Tackle","tackle",3]];
const REL_ACTIONS=[["Extra video session with the coach","coach",8,10,0],
["Team barbecue at your place","teammates",8,5,100],
["Fan signing session","fans",8,10,0]];
const STAT_KEYS=["speed","strength","passing","kicking","tackle"];
const REL_KEYS=["coach","teammates","fans"];
const capital=s=>s[0].toUpperCase()+s.slice(1);
/* ================= state ================= */
let state=null;
function newGame(name){
  const teams=TEAMS.map(([n,a])=>({name:n,abbrev:a,strength:randint(35,75),
    played:0,won:0,drawn:0,lost:0,pf:0,pa:0,pts:0}));
  const idx=Math.floor(rand()*teams.length);
  return{
    player:{name,speed:40,strength:40,passing:40,kicking:40,tackle:40,
      energy:100,cash:500,coach:60,teammates:60,fans:50,seasonTries:0,seasonGoals:0,careerYear:1},
    teamIdx:idx,contract:{club:teams[idx].name,wage:300,seasonsLeft:2},
    teams,roundNo:1,seasonNo:1};
}
const myTeam=()=>state.teams[state.teamIdx];
function adjust(o,k,d){o[k]=Math.max(0,Math.min(100,Math.round(o[k]+d)));}
const overall=p=>Math.round(STAT_KEYS.reduce((a,k)=>a+p[k],0)/STAT_KEYS.length);
const benched=p=>p.coach<25;
const effective=(stat,energy)=>Math.round(stat*(0.5+0.5*energy/100));
function recordResult(t,f,a){
  t.played++;t.pf+=f;t.pa+=a;
  if(f>a){t.won++;t.pts+=2;}else if(f===a){t.drawn++;t.pts+=1;}else t.lost++;
}
function sortLadder(ts){return[...ts].sort((a,b)=>b.pts-a.pts||(b.pf-b.pa)-(a.pf-a.pa)||b.pf-a.pf);}
/* ================= fixtures & AI ================= */
function genFixtures(numTeams,rounds){
  const ids=[...Array(numTeams).keys()];
  if(numTeams%2)ids.push(BYE);
  const n=ids.length,base=[];
  let order=ids.slice();
  for(let r=0;r<n-1;r++){
    const pairs=[];
    for(let i=0;i<n/2;i++)pairs.push([order[i],order[n-1-i]]);
    base.push(pairs);
    order=[order[0],order[n-1],...order.slice(1,-1)];
  }
  const fixtures=[];
  for(let r=0;r<rounds;r++){
    let pairs=base[r%base.length];
    if(Math.floor(r/base.length)%2===1)pairs=pairs.map(([a,b])=>[b,a]);
    fixtures.push(pairs.map(([a,b])=>a===BYE?[b,a]:[a,b]));
  }
  return fixtures;
}
function opponentFor(fixtures,roundNo,teamIdx){
  for(const[a,b]of fixtures[roundNo-1]){if(a===teamIdx)return b;if(b===teamIdx)return a;}
  return null;
}
function aiScore(atk,dfn){
  const edge=(atk.strength-dfn.strength)/100;
  const tries=Math.max(0,Math.round(gauss(3+2.5*edge,1.3)));
  let conv=0;for(let i=0;i<tries;i++)if(rand()<0.72)conv++;
  return tries*4+conv*2+choice([0,0,0,1,1,2])*2;
}
function simulateOtherMatches(fixtures){
  for(const[a,b]of fixtures[state.roundNo-1]){
    if(a===state.teamIdx||b===state.teamIdx)continue;
    if(b===BYE){state.teams[a].pts+=2;continue;}
    const ta=state.teams[a],tb=state.teams[b];
    const sa=aiScore(ta,tb),sb=aiScore(tb,ta);
    recordResult(ta,sa,sb);recordResult(tb,sb,sa);
  }
}
/* ================= kick mini-game (arcade) ================= */
const POWER_CENTER=75,ANGLE_CENTER=0;
const sweetWidth=k=>6+k*0.10;
function judgeKick(power,angle,kstat){
  const w=sweetWidth(kstat);
  const success=Math.abs(power-POWER_CENTER)<=w&&Math.abs(angle-ANGLE_CENTER)<=w;
  const quality=success&&Math.abs(power-POWER_CENTER)<4&&Math.abs(angle)<4?"perfect":success?"good":"miss";
  return{power,angle,success,quality};
}
function drawKickScene(t,label,opts={}){
  canvasMode();
  ctx.fillStyle=NIGHT;ctx.fillRect(0,0,CW,CH);
  drawCrowd(t);
  for(let y=94,i=0;y<CH;y+=46,i++){ctx.fillStyle=i%2?FIELD_A:FIELD_B;ctx.fillRect(0,y,CW,46);}
  ctx.fillStyle=LINE;
  ctx.fillRect(0,286,CW,4);
  ctx.fillRect(0,500,CW,3);
  drawPosts(CW/2,290);
  if(!opts.ballFlying){
    ctx.fillStyle="#d8d8d8";ctx.fillRect(CW/2-3,478,6,8);
    drawBall(CW/2,470,1.15,-.9);
  }
  drawPlayerSprite(CW/2-42,506,5.2,MY_KIT,Math.floor(t*6)%2,1,opts.kickPose?"kick":"run");
  atext(label,CW/2,44,26,"#d98fe8");
}
function drawPowerGauge(value,kstat,locked){
  const x=64,top=150,h=320,w=34;
  ctx.fillStyle="rgba(6,10,14,.74)";ctx.fillRect(x-16,top-42,w+70,h+76);
  const sw=sweetWidth(kstat);
  ctx.fillStyle="#14301c";ctx.fillRect(x,top,w,h);
  const y1=top+h*(1-(POWER_CENTER+sw)/100),y2=top+h*(1-(POWER_CENTER-sw)/100);
  ctx.fillStyle="#2f9e4f";ctx.fillRect(x,y1,w,y2-y1);
  const fy=top+h*(1-value/100);
  ctx.fillStyle=locked?"#4ec96a":"#e0a83c";ctx.fillRect(x+5,fy,w-10,top+h-fy);
  ctx.fillStyle="#fff";ctx.fillRect(x-6,fy-2,w+12,4);
  atext("POWER",x+w/2,top-24,15,"#5fd7d7");
  atext(String(Math.round(value)),x+w/2,top+h+22,17,locked?"#4ec96a":"#e0a83c");
  if(!locked)atext("[SPACE]",x+w/2,top+h+44,12,"#8b98a5");
}
function drawAngleGauge(value,kstat){
  const w=420,x=(CW-w)/2,y=548,h=20;
  ctx.fillStyle="rgba(6,10,14,.74)";ctx.fillRect(x-20,y-36,w+40,72);
  ctx.fillStyle="#14301c";ctx.fillRect(x,y,w,h);
  const sw=sweetWidth(kstat);
  const zx=x+w*((ANGLE_CENTER-sw+50)/100),zw=w*(2*sw/100);
  ctx.fillStyle="#2f9e4f";ctx.fillRect(zx,y,zw,h);
  ctx.fillStyle="rgba(255,255,255,.5)";ctx.fillRect(x+w/2-1,y-4,2,h+8);
  const mx=x+w*((value+50)/100);
  ctx.fillStyle="#fff";
  ctx.beginPath();ctx.moveTo(mx,y-4);ctx.lineTo(mx-7,y-16);ctx.lineTo(mx+7,y-16);ctx.closePath();ctx.fill();
  atext("WIND / ANGLE — [SPACE] at the centre",x+w/2,y-26,14,"#5fd7d7");
  atext("HOOK",x-38,y+h/2,13,"#8b98a5");
  atext("SLICE",x+w+40,y+h/2,13,"#8b98a5");
}
async function playKick(kstat,label){
  const p=new Osc(0,100,140);
  await frameLoop((dt,keys)=>{
    p.adv(dt);
    drawKickScene(performance.now()/1000,label);
    drawPowerGauge(p.value,kstat,false);
    return keys.includes(" ");
  });
  const a=new Osc(-50,50,110,-50);
  await frameLoop((dt,keys)=>{
    a.adv(dt);
    drawKickScene(performance.now()/1000,label);
    drawPowerGauge(p.value,kstat,true);
    drawAngleGauge(a.value,kstat);
    return keys.includes(" ");
  });
  const r=judgeKick(p.value,a.value,kstat);
  const ex=CW/2+r.angle*3.2;
  const ey=r.success?168:(Math.abs(r.angle)>sweetWidth(kstat)?200:330);
  const frames=30;
  for(let i=0;i<=frames;i++){
    const ft=i/frames,t=performance.now()/1000;
    drawKickScene(t,label,{ballFlying:true,kickPose:i<8});
    const bx=CW/2+(ex-CW/2)*ft;
    const by=470+(ey-470)*ft-Math.sin(ft*Math.PI)*90;
    drawBall(bx,by,1.15-.7*ft,ft*9);
    await sleep(26);
  }
  const v={perfect:["PERFECT STRIKE!","#4ec96a"],
    good:["IT'S GOOD!","#4ec96a"],
    miss:["MISSED! Drifts wide...","#ff5f5f"]}[r.quality];
  await canvasBanner(v[0],v[1]);
  return r;
}
/* ================= pass mini-game (arcade) ================= */
const PF_W=60,PF_H=16,MAX_ANGLE=50,DEF_REACH=1.4;
const catchRadius=p=>1.0+p*0.015;
function makeSetup(){return{py:PF_H>>1,px:3,dy:randint(3,PF_H-4),dx:PF_W>>1,wy:randint(2,PF_H-3),wx:PF_W-5};}
const trajY=(s,angle,x)=>s.py-Math.tan(angle*Math.PI/180)*(x-s.px);
function judgePass(s,angle,pstat){
  if(Math.abs(trajY(s,angle,s.dx)-s.dy)<=DEF_REACH)return"intercepted";
  return Math.abs(trajY(s,angle,s.wx)-s.wy)<=catchRadius(pstat)?"complete":"wasted";
}
const pgx=x=>52+x*(856/PF_W);
const pgy=y=>132+y*(400/(PF_H-1));
function drawPassScene(t,s,angle,opts={}){
  canvasMode();
  ctx.fillStyle=NIGHT;ctx.fillRect(0,0,CW,CH);
  drawCrowd(t);
  for(let x=0,i=0;x<CW;x+=80,i++){ctx.fillStyle=i%2?FIELD_A:FIELD_B;ctx.fillRect(x,94,80,CH-94);}
  ctx.fillStyle=LINE;
  ctx.fillRect(28,104,CW-56,4);

const BF_W=62,BF_H=12,RUN_SECS=4,PLX=4;
const bgx=x=>48+x*(864/BF_W);
const bgy=y=>158+y*(380/(BF_H-1));
async function playBreakaway(speedStat){
  const run={y:BF_H>>1,defs:[],elapsed:0,spawn:0,tackled:false,metres:0};
  const spawnInt=0.55+speedStat*0.002;
  function tick(dt){
    if(run.tackled)return;
    run.elapsed+=dt;run.metres+=dt*22;run.spawn+=dt;
    if(run.spawn>=spawnInt){run.spawn=0;run.defs.push({x:BF_W-1,y:randint(0,BF_H-1)});}
    const rush=26+run.elapsed*5;
    for(const d of run.defs)d.x-=rush*dt;
    run.defs=run.defs.filter(d=>d.x>0);
    if(run.defs.some(d=>d.y===run.y&&Math.abs(d.x-PLX)<1.2))run.tackled=true;
  }
  function draw(){
    canvasMode();
    const t=performance.now()/1000;
    ctx.fillStyle=NIGHT;ctx.fillRect(0,0,CW,CH);
    drawCrowd(t);
    const off=-(run.metres*14)%160;
    for(let x=off-160,i=0;x<CW+160;x+=80,i++){
      ctx.fillStyle=i%2?FIELD_A:FIELD_B;ctx.fillRect(x,94,80,CH-94);
    }
    ctx.fillStyle=LINE;
    ctx.fillRect(0,140,CW,3);ctx.fillRect(0,CH-28,CW,3);
    ctx.fillStyle="rgba(255,255,255,.35)";
    for(let i=0;i<6;i++){
      const sx=(i*173+run.metres*90)%CW;
      ctx.fillRect(CW-sx,150+i*70,44,2);
    }
    const fr=Math.floor(t*9)%2;
    drawPlayerSprite(bgx(PLX),bgy(run.y)+16,5,MY_KIT,fr,1,run.tackled?"kick":"run");
    for(const d of run.defs)drawPlayerSprite(bgx(d.x),bgy(d.y)+16,5,OPP_KIT,1-fr,-1);
    atext("BREAKAWAY! Dodge with UP / DOWN",CW/2,44,24,"#d98fe8");
    atext("Try line in "+Math.max(0,RUN_SECS-run.elapsed).toFixed(1)+"s   ·   "+Math.floor(run.metres)+"m",
      CW/2,72,17,"#e0a83c");
    if(run.tackled){
      atext("CRUNCH!",bgx(PLX)+40,bgy(run.y)-60,30,"#ff5f5f");
    }
  }
  await frameLoop((dt,keys)=>{
    for(const k of keys){
      if(k==="ArrowUp"||k==="k")run.y=Math.max(0,run.y-1);
      else if(k==="ArrowDown"||k==="j")run.y=Math.min(BF_H-1,run.y+1);
    }
    tick(dt);draw();
    return run.tackled||run.elapsed>=RUN_SECS;
  });
  if(run.tackled){draw();await sleep(350);}
  await canvasBanner(run.tackled?"WRAPPED UP!":"TRY!!!",run.tackled?"#ff5f5f":"#4ec96a");
  return!run.tackled;
}

}

function pickMoments(p){
  const n=randint(3,5);
  const kinds=["breakaway","pass","bomb","penalty_kick"];
  const w=[3,p.teammates<35?1:3,2,2];
  return Array.from({length:n},()=>weighted(kinds,w));
}
function planMatch(opp){
  const my=myTeam(),p=state.player,events=[];
  for(const[side,atk,dfn,damp]of[[0,my,opp,.72],[1,opp,my,1]]){
    const edge=(atk.strength-dfn.strength)/100;
    const n=Math.max(0,Math.round(gauss((2.6+2.2*edge)*damp,1)));
    for(let i=0;i<n;i++){
      const conv=rand()<.72;
      events.push({minute:randint(2,79),kind:"ai",side,points:4+(conv?2:0),
        text:"TRY! "+choice(SURNAMES)+" crosses for "+atk.abbrev+"!"+(conv?" Conversion good.":"")});
    }
  }
  for(let m=3;m<80;m+=randint(4,7))
    events.push({minute:m,kind:"commentary",
      text:choice(FLAVOUR).replace("{p}",choice(SURNAMES)).replace("{t}",choice([my,opp]).abbrev)});
  const kinds=pickMoments(p),mins=sampleMinutes(8,75,kinds.length);
  kinds.forEach((k,i)=>events.push({minute:mins[i],kind:"moment",moment:k}));
  events.sort((a,b)=>a.minute-b.minute||((a.kind!=="commentary")-(b.kind!=="commentary")));
  return events;
}

async function conversion(out){

  const r=await playKick(effective(p.kicking,p.energy),"CONVERSION ATTEMPT");
  if(r.success){out.my+=2;out.goals++;p.seasonGoals++;out.feed.push(p.name+" adds the extras.");}

async function runMoment(kind,out){
  const p=state.player;
  out.momTot++;
  await momentSplash(kind);
  if(kind==="breakaway"){
    if(await playBreakaway(effective(p.speed,p.energy))){
      out.my+=4;out.tries++;out.momWon++;p.seasonTries++;
      out.feed.push("TRY! "+p.name+" goes the length of the field!!");
      await conversion(out);
    }else out.feed.push(p.name+" is dragged down just short!");
  }else if(kind==="pass"){
    const q=await playPass(effective(p.passing,p.energy));
    if(q==="complete"){
      out.my+=4;out.momWon++;
      out.feed.push("TRY! "+p.name+"'s cut-out ball sends the winger over!");
      await conversion(out);
    }else if(q==="intercepted"){
      out.opp+=4;
      out.feed.push("Disaster! "+p.name+"'s pass is picked off and run back for a try!");
    }else out.feed.push(p.name+"'s pass floats into touch.");
  }else if(kind==="bomb"){
    const r=await playKick(effective(p.kicking,p.energy),"BOMB KICK — hang it high!");
    if(r.success){
      out.my+=4;out.momWon++;
      out.feed.push(p.name+"'s bomb is spilled — the winger pounces to score!");
      await conversion(out);
    }else out.feed.push(p.name+"'s bomb sails dead. Seven-tackle set.");
  }else{
    const r=await playKick(effective(p.kicking,p.energy),"PENALTY GOAL ATTEMPT");
    if(r.success){
      out.my+=2;out.goals++;out.momWon++;p.seasonGoals++;
      out.feed.push(p.name+" slots the penalty goal. Money.");
    }else out.feed.push(p.name+" pushes the penalty attempt wide.");
  }
  adjust(p,"energy",-6);
}
async function playMatch(opp){
  const events=planMatch(opp);
  const out={my:0,opp:0,tries:0,goals:0,momWon:0,momTot:0,feed:[]};
  out.feed.push("Kick-off! "+myTeam().name+" v "+opp.name+".");
  let idx=0;
  for(let minute=1;minute<=80;minute++){
    while(idx<events.length&&events[idx].minute<=minute){
      const ev=events[idx++];
      if(ev.kind==="commentary")out.feed.push(ev.text);
      else if(ev.kind==="ai"){
        if(ev.side===0)out.my+=ev.points;else out.opp+=ev.points;
        out.feed.push(ev.text);
      }else{
        drawScoreboard(opp,minute,out);
        await sleep(400);
        await runMoment(ev.moment,out);
      }
    }
    if(minute===40)out.feed.push("HALF TIME: "+myTeam().abbrev+" "+out.my+" — "+out.opp+" "+opp.abbrev);
    drawScoreboard(opp,minute,out);
    await sleep(140);
  }
  out.feed.push("FULL TIME: "+myTeam().abbrev+" "+out.my+" — "+out.opp+" "+opp.abbrev);
  drawScoreboard(opp,80,out);
  await sleep(600);
  return out;
}
function applyPostMatch(opp,out){
  const p=state.player,my=myTeam(),lines=[];
  recordResult(my,out.my,out.opp);recordResult(opp,out.opp,out.my);
  const won=out.my>out.opp,drew=out.my===out.opp;
  p.cash+=state.contract.wage;
  lines.push("Match wage: +$"+state.contract.wage);
  adjust(p,"energy",-18);
  const share=out.momTot?out.momWon/out.momTot:.5;
  if(won){adjust(p,"coach",6);adjust(p,"fans",5);adjust(p,"teammates",4);lines.push("Victory! The sheds are buzzing.");}
  else if(drew){adjust(p,"coach",1);lines.push("A draw. Mixed feelings in the sheds.");}
  else{adjust(p,"coach",-5);adjust(p,"fans",-3);lines.push("Loss. The coach glares at his clipboard.");}
  if(share>=.75){adjust(p,"fans",6);adjust(p,"coach",4);lines.push("You starred in the big moments — the crowd chants your name!");}
  else if(share<=.25){adjust(p,"fans",-4);adjust(p,"coach",-4);adjust(p,"teammates",-2);lines.push("You fluffed the big moments... heads shake in the stands.");}
  const bonus=out.tries*150+out.goals*40;
  if(bonus){p.cash+=bonus;lines.push("Performance bonuses: +$"+bonus);}
  return lines;
}

  let alive=true;
  if(state.contract.seasonsLeft<=0){
    const score=overall(p)+Math.floor(p.coach/2)+Math.floor(p.fans/2);
    if(score>=95){
      const wage=Math.floor(state.contract.wage*1.5);
      state.contract={club:myTeam().name,wage,seasonsLeft:2};
      lines.push("Contract renewed! New wage: $"+wage+"/match for 2 seasons.");
    }else{
      lines.push("The club releases you. Your career is over.");
      alive=false;
    }
  }else lines.push(state.contract.seasonsLeft+" season(s) left on your deal.");
  await showLines("END OF SEASON "+state.seasonNo,lines);
  if(!alive)return false;
  state.seasonNo++;state.roundNo=1;p.careerYear++;
  p.seasonTries=0;p.seasonGoals=0;p.energy=100;
  for(const t of state.teams){t.played=t.won=t.drawn=t.lost=0;t.pf=t.pa=t.pts=0;}
  return true;
}
async function careerLoop(){
  const fixtures=genFixtures(TEAMS.length,ROUNDS);
  while(true){
    if(state.roundNo>ROUNDS){
      if(!(await endOfSeason()))return;
      continue;
    }
    const action=await dashboardMenu();
    if(action==="quit")return;
    if(action==="ladder")await showLadder();
    else if(action==="match")await playRound(fixtures);
    else if(action==="training")await trainingScreen();
    else if(action==="shop")await shopScreen();
    else if(action==="relationships")await relationshipsScreen();
  }
}
/* ================= title & main ================= */
async function titleScreen(){
  let name="",done=false;
  await frameLoop((dt,keys)=>{
    for(const k of keys){
      if(k==="Enter")done=true;
      else if(k==="Backspace")name=name.slice(0,-1);
      else if(k.length===1&&/[a-zA-Z '\-]/.test(k)&&name.length<14)name+=k;
    }
    canvasMode();
    const t=performance.now()/1000;
    ctx.fillStyle=NIGHT;ctx.fillRect(0,0,CW,CH);
    drawCrowd(t);
    for(let y=94,i=0;y<CH;y+=46,i++){ctx.fillStyle=i%2?FIELD_A:FIELD_B;ctx.fillRect(0,y,CW,46);}
    drawPosts(CW/2,300);
    drawPlayerSprite(CW/2-190,500,8,MY_KIT,Math.floor(t*6)%2,1);
    drawPlayerSprite(CW/2+190,500,8,OPP_KIT,1-Math.floor(t*6)%2,-1);
    drawBall(CW/2,455,1.6,-.5);
    atext("N R L",CW/2,150,64,"#5fd7d7");
    atext("CAREER SIMULATOR",CW/2,205,30,"#d98fe8");
    atext("From park footy to Immortal.",CW/2,246,15,"#8b98a5");
    atext("Enter your name:",CW/2,330,18,"#c8d2dc");
    atext((name||"_")+"█",CW/2,364,24,"#e0a83c");
    atext("[Enter] start career"+(name.trim()?"":" as 'Rookie'"),CW/2,420,16,"#4ec96a");
    atext("Keyboard required · Space locks the bars · Arrows dodge · q backs out",CW/2,560,13,"#8b98a5");
    return done;
  });
  return name.trim()||"Rookie";
}
async function gameOver(){
  const p=state.player;
  await showLines("CAREER OVER",[
    p.name+" retires after "+p.careerYear+" season(s) in first grade.",
    "Final overall rating: "+overall(p)+".",
    "",
    "Press any key to start a new career."]);
}
(async function(){
  while(true){
    const name=await titleScreen();
    state=newGame(name);
    await careerLoop();
    await gameOver();
  }
})();
</script>
